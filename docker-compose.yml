services:
  redis:
    image: redis:8-alpine
    container_name: mdjebot-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6161:6379"
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-.}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - mdjebot

  mariadb:
    image: mariadb:12
    container_name: mdjebot-mariadb
    restart: unless-stopped
    env_file:
      - ${MDJEBOT_CONFIG_DIR:-.}/.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --max-connections=500
    ports:
      - "127.0.0.1:6162:3306"
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-.}/data/mariadb:/var/lib/mysql
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - mdjebot

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: mdjebot-phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "6163:80"
    networks:
      - mdjebot

  # Bot Builder: the Telegram bot where customers buy a plan and send their bot token; it then creates
  # and hosts their own MdjeBot as a sibling container (own database, Redis namespace and host port).
  builder:
    image: ghcr.io/mdjes/mdjebot:${MDJEBOT_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mdjebot-builder
    restart: unless-stopped
    entrypoint: []
    command: ["uv", "run", "builder_main.py"]
    env_file:
      - ${MDJEBOT_CONFIG_DIR:-.}/.env
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-/opt/mdjebot}/.env:/app/.env:ro
      - ${MDJEBOT_CONFIG_DIR:-/opt/mdjebot}/builder:/app/builder_data
      # Same path inside and outside, so `docker run -v` paths resolve on the host.
      - ${MDJEBOT_CONFIG_DIR:-/opt/mdjebot}/tenants:${MDJEBOT_CONFIG_DIR:-/opt/mdjebot}/tenants
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mdjebot

networks:
  mdjebot:
    name: mdjebot

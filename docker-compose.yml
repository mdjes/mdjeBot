services:
  redis:
    image: redis:8-alpine
    container_name: mdjebot-redis
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6161:6379"
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-.}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - mdjebot

  mariadb:
    image: mariadb:12
    container_name: mdjebot-mariadb
    restart: unless-stopped
    env_file:
      - ${MDJEBOT_CONFIG_DIR:-.}/.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    ports:
      - "127.0.0.1:6162:3306"
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-.}/data/mariadb:/var/lib/mysql
    stop_grace_period: 120s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root --password=$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - mdjebot

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: mdjebot-phpmyadmin
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "6163:80"
    networks:
      - mdjebot

  bot:
    image: ghcr.io/mdjes/mdjebot:${MDJEBOT_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: mdjebot
    restart: unless-stopped
    env_file:
      - ${MDJEBOT_CONFIG_DIR:-.}/.env
    volumes:
      - ${MDJEBOT_CONFIG_DIR:-.}/.env:/app/.env:ro
      - ${MDJEBOT_CONFIG_DIR:-.}/logs:/app/logs
      - ${MDJEBOT_CONFIG_DIR:-.}/sessions:/app/sessions
      - ${MDJEBOT_CONFIG_DIR:-.}/data/pwa_icons:/app/data/pwa_icons
      - /var/lib/mdjebot:/var/lib/mdjebot:ro
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${FASTAPI_PORT:-6160}:${FASTAPI_PORT:-6160}"
    networks:
      - mdjebot

networks:
  mdjebot:
    name: mdjebot
